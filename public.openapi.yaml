        product_id:
          type: string
        status:
          type: string
        label:
          type: string
        credential_mode:
          type: string
        public:
          type: boolean
        trial:
          type: object
          additionalProperties: true
        entitlement_template:
          $ref: '#/components/schemas/EntitlementTemplate'
        components:
          type: array
          items:
            type: object
            additionalProperties: true
        discounts:
          type: object
          additionalProperties: true
        managed_credit_topup_amounts_cad_cents:
          type: array
          items:
            type: integer
    PublicModelList:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicModelDetail'
    PublicModelDetail:
      type: object
      required:
      - id
      - provider
      - display_name
      - object
      - categories
      - capabilities
      - supported_parameters
      - channel
      - pricing
      - status_component
      properties:
        id:
          type: string
        provider:
          type: string
        display_name:
          type: string
        object:
          type: string
          const: model
        description:
          type: string
        description_fr:
          type: string
        best_for:
          type: string
        best_for_fr:
          type: string
        categories:
          type: array
          items:
            type: string
        context_length:
          type:
          - integer
          - 'null'
        release_date:
          type:
          - string
          - 'null'
        modalities:
          type:
          - object
          - 'null'
          additionalProperties: true
        capabilities:
          type: array
          items:
            type: string
        supported_parameters:
          type: array
          items:
            type: string
        channel:
          $ref: '#/components/schemas/PublicChannel'
        status_component:
          type: string
        reasoning:
          $ref: '#/components/schemas/ReasoningDescriptor'
        pricing:
          type: object
          additionalProperties: true
        performance:
          type:
          - object
          - 'null'
          additionalProperties: true
        uptime:
          type:
          - object
          - 'null'
          additionalProperties: true
        activity:
          type:
          - object
          - 'null'
          additionalProperties: true
        tools:
          type:
          - object
          - 'null'
          additionalProperties: true
    PublicModelCategoryList:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            required:
            - id
            - label_en
            - label_fr
            - sort_order
            - tone
            properties:
              id:
                type: string
              label_en:
                type: string
              label_fr:
                type: string
              sort_order:
                type: integer
              tone:
                type: string
    PublicNotFoundError:
      type: object
      required:
      - error
      properties:
