          type: string
          const: not_found
    PublicStatus:
      type: object
      required:
      - service
      - status
      - checked_at
      - components
      properties:
        service:
          type: string
          example: tonia-pass
        status:
          type: string
          enum:
          - operational
          - degraded
          - outage
          - not_configured
        checked_at:
          type: string
          format: date-time
        components:
          type: array
          items:
            type: object
            required:
            - name
            - status
            - detail
            - checked_at
            - public
            properties:
              name:
                type: string
              status:
                type: string
                enum:
                - operational
                - degraded
                - outage
                - not_configured
              detail:
                type: string
              checked_at:
                type: string
              public:
                type: boolean
    RuntimeModelList:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeModel'
    RuntimeModel:
      type: object
      required:
      - id
      - object
      - context_length
      - supported_parameters
      properties:
        id:
          type: string
        object:
          type: string
          const: model
        context_length:
          type:
          - integer
          - 'null'
        supported_parameters:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
          description: >
            Per-model action flags from the Pass registry (e.g. web_search,
            reasoning, image_tool, image_generation, image_edit, vision,
            file_input). Soft flags (vision, file_input) are discovery/badge
            only — they do not replace tenant envelope attachments. Hard flags
            (image_edit, image_generation routing) gate wrong-path calls.
            See PLANS/02-architecture/products/model-discovery.md.
        modalities:
          type: object
          description: >
            Layer B media shapes `{ input: string[], output: string[] }`
            (text/image/file/audio). Additive discovery; not a hard gate.
          additionalProperties: true
        reasoning:
          $ref: '#/components/schemas/ReasoningDescriptor'
        pricing:
          type: object
          additionalProperties: true
          description: Present for managed-priced models only
    PassthroughRequest:
      type: object
      description: 'Upstream-shaped request body. Not re-typed by tonia. May include

        top-level `reasoning_effort` when present.

        '
      additionalProperties: true
    PassthroughResponse:
      type: object
      description: Upstream-shaped success body
      additionalProperties: true
    PassthroughOrBlockResponse:
      type: object
      description: 'Provider-native body. When policy/entitlement blocks render as

        chat_200, the same body also carries `_tonia_policy_block` or

        `_tonia_entitlement_block` — treat as an error.

        '
      additionalProperties: true
      properties:
        _tonia_policy_block:
          $ref: '#/components/schemas/PolicyBlockCarrier'
        _tonia_entitlement_block:
          $ref: '#/components/schemas/EntitlementBlockCarrier'
    PolicyBlockCarrier:
      type: object
      description: chat_200 policy block carrier (no retryable)
      required:
      - code
      properties:
        code:
          type: string
        law25_article:
          type: string
        efvp_section:
          type: string
        scope_field:
          type: string
        detail:
          type: string
        message:
          type: string
        action:
          type: string
        categories:
          type: array
          items:
            type: string
        hit_count:
          type: integer
        details:
          type: array
          items:
            type: object
            additionalProperties: true
        media:
          type: object
          additionalProperties: true
    EntitlementBlockCarrier:
      type: object
      description: chat_200 entitlement block carrier
      required:
      - type
      - code
      - scope
      - retryable
      - message
      - action
      properties:
        type:
          type: string
          const: entitlement_block
        code:
          type: string
        scope:
          type: string
          description: Wire scope. `organization` means the Workspace.
          enum:
          - member
          - organization
          - operator
        retryable:
          type: boolean
        message:
          type: string
        action:
          type: string
    StructuredError:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - authentication_error
          - billing_error
          - entitlement_error
          - invalid_request_error
          - byok_key_missing
          - policy_block
          - tenant_upstream_blocked
          - managed_credential_unavailable
          - rate_limit_error
          - api_error
        code:
          type: string
        retryable:
          type: boolean
          description: Present on runtime hard errors except policy_block
        reason:
          type: string
          description: 'Present on admission 429 (`code: admission_rate_limited`).

            Why this call was refused. Distinct from monthly quota 429.

            '
          enum:
          - rpm_per_key
          - concurrency_per_key
          - concurrency_per_tenant
          - concurrency_global
        scope:
          type: string
          description: 'Who the limit applies to. Entitlement errors use `member` /

            `organization` / `operator` (`organization` means the Workspace). Admission

            429 uses `key` / `tenant` / `global` (`tenant` means this workspace).

            '
          enum:
          - member
          - organization
          - operator
          - key
          - tenant
          - global
        message:
          type: string
        provider:
          type: string
        required_surface:
          type: string
          description: Present when `code` is `provider_requires_surface` (e.g. `interactions`).
        detail:
          type: string
        docs:
          type: string
        law25_article:
          type: string
        efvp_section:
          type: string
        scope_field:
          type: string
        requested:
          type: string
        allowed:
          type: string
        status:
          type: integer
        dlp:
          type: object
          additionalProperties: true
        media:
          type: object
          additionalProperties: true
      additionalProperties: true
    StructuredErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/StructuredError'
