openapi: 3.1.0
info:
  title: tonia Pass API
  version: 0.1.0
  summary: OpenAPI contract for the official tonia Pass SDKs.
  description: |
    Developer API for Pass (`https://pass.tonia.ca:8443`).

    **Tags → auth**
    - `public` — unauthenticated catalogue / models / status
    - `runtime` — `tonia_*` Bearer or `x-api-key` (Bearer wins if both)

    Chat, messages, embeddings, images, responses, rerank, and interactions
    request bodies stay upstream-shaped. Official SDKs add auth, base URL,
    typed errors, and named helpers.

    **Supported path prefixes** for raw SDK requests:
    `/v1/public/`, `/v1/status`, `/v1/models`,
    `/v1/chat/`, `/v1/messages`, `/v1/embeddings`, `/v1/images/`,
    `/v1/responses`, `/v1/rerank`, `/v1/interactions`.
    Other paths are not supported.

    Workspace settings, billing, member invites, and API-key management
    are handled in the tonia portal — not in this API.

    Content redaction is a portal profile mode (`dlp_mode: "redact"`), not an
    SDK header or retry flag.

    Official SDKs do not auto-retry. Honor `error.retryable` and `Retry-After`.
    Admission 429 (`rate_limit_error` / `admission_rate_limited`) is refused
    immediately — it is not queued. Per-key RPM defaults to 600. In-flight
    concurrency is a separate limit; a streaming call holds a slot until the
    stream ends. Monthly quota 429 is `entitlement_error` /
    `request_quota_exhausted`. Budget exhaustion is 402 `entitlement_error`
    and is not retryable.

    Server-side chat history (`/v1/conversations*`) is chat-app only and is
    not part of the public SDK contract.
  contact:
    name: tonia
    url: https://tonia.ca
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
- url: https://pass.tonia.ca:8443
  description: Production Pass
- url: http://127.0.0.1:8444
  description: Local development
tags:
- name: public
  description: Unauthenticated commercial catalogue, Managed model SKUs, status
- name: runtime
  description: Authenticated model discovery + LLM helpers
paths:
  /v1/public/catalogue:
    get:
      tags:
      - public
      operationId: catalogueList
      summary: Commercial tier / offer catalogue
      description: 'Unauthenticated commercial catalogue (Stripe products, public active

        offers, entitlement templates). Not a model SKU list — use

        `/v1/public/models` for Managed SKUs.

        '
      responses:
        '200':
          description: Catalogue snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCatalogue'
  /v1/public/models:
    get:
      tags:
      - public
      operationId: publicModelsList
      summary: Public Managed model SKU list
      responses:
        '200':
          description: List of public model details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelList'
  /v1/public/models/{id}:
    get:
      tags:
      - public
      operationId: publicModelsGet
      summary: Public Managed model SKU detail
      parameters:
      - $ref: '#/components/parameters/ModelId'
      responses:
        '200':
          description: Public model detail (may include telemetry enrichment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelDetail'
        '404':
          description: Flat string error (not structured taxonomy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNotFoundError'
  /v1/public/model-categories:
    get:
      tags:
      - public
      operationId: publicModelCategoriesList
      summary: Category labels for the public model catalogue
      responses:
        '200':
          description: Active category definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelCategoryList'
  /v1/status:
    get:
      tags:
      - public
      operationId: statusGet
      summary: Public service health aggregation
      responses:
        '200':
          description: Aggregated status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatus'
  /v1/models:
    get:
      tags:
      - runtime
      operationId: modelsList
      summary: Runtime model discovery for the calling key
      description: 'Authenticated list scoped to what the key/tenant may call.

        Header shape affects list presentation (`x-api-key` only → Anthropic-

        shaped ids; Bearer → OpenAI-shaped). Optional `reasoning` descriptor

        when the model declares efforts.

        '
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/HttpReferer'
      - $ref: '#/components/parameters/XToniaTitle'
      - $ref: '#/components/parameters/XToniaCategories'
      responses:
        '200':
          description: Runtime model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeModelList'
        default:
          $ref: '#/components/responses/RuntimeError'
  /v1/models/{id}:
    get:
      tags:
      - runtime
      operationId: modelsGet
      summary: Runtime model retrieve
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/ModelId'
      - $ref: '#/components/parameters/HttpReferer'
      - $ref: '#/components/parameters/XToniaTitle'
      - $ref: '#/components/parameters/XToniaCategories'
      responses:
        '200':
          description: Single runtime model entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeModel'
        '404':
          $ref: '#/components/responses/RuntimeError'
        default:
          $ref: '#/components/responses/RuntimeError'
  /v1/chat/completions:
    post:
      tags:
      - runtime
      operationId: chatCompletionsCreate
      summary: OpenAI-shaped chat completions
      description: 'Upstream-shaped body. Prefer `Authorization: Bearer`. May return HTTP

        200 with `_tonia_policy_block` or `_tonia_entitlement_block` carriers —

        HTTP 200 may still include `_tonia_policy_block` or `_tonia_entitlement_block`

        — treat those as errors. Soft-limit headers `x-tonia-limit-*` may appear

        on success. Top-level `reasoning_effort` is accepted when present; Pass

        clamps it to the model''s declared set.

        '
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/HttpReferer'
      - $ref: '#/components/parameters/XToniaTitle'
      - $ref: '#/components/parameters/XToniaCategories'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassthroughRequest'
      responses:
        '200':
          description: Provider-native completion, or chat_200 block carrier
          headers:
            x-tonia-limit-warning:
              $ref: '#/components/headers/XToniaLimitWarning'
            x-tonia-limit-scope:
              $ref: '#/components/headers/XToniaLimitScope'
            x-tonia-limit-kind:
              $ref: '#/components/headers/XToniaLimitKind'
            x-tonia-limit-used:
              $ref: '#/components/headers/XToniaLimitUsed'
            x-tonia-limit-value:
              $ref: '#/components/headers/XToniaLimitValue'
            x-tonia-limit-remaining:
              $ref: '#/components/headers/XToniaLimitRemaining'
            x-tonia-limit-period-ends-at:
              $ref: '#/components/headers/XToniaLimitPeriodEndsAt'
            x-tonia-policy-block:
              $ref: '#/components/headers/XToniaPolicyBlock'
            x-tonia-policy-categories:
              $ref: '#/components/headers/XToniaPolicyCategories'
            x-tonia-entitlement-block:
              $ref: '#/components/headers/XToniaEntitlementBlock'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassthroughOrBlockResponse'
            text/event-stream:
              schema:
                type: string
                description: SSE stream (OpenAI chunk envelopes; Cohere may be reshaped)
        default:
          $ref: '#/components/responses/RuntimeError'
  /v1/messages:
    post:
      tags:
      - runtime
      operationId: messagesCreate
      summary: Anthropic-shaped messages
      description: Prefer `x-api-key`. Same chat_200 carrier / soft-limit rules as chat.
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/HttpReferer'
      - $ref: '#/components/parameters/XToniaTitle'
      - $ref: '#/components/parameters/XToniaCategories'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassthroughRequest'
      responses:
        '200':
          description: Provider-native message, or chat_200 block carrier
          headers:
            x-tonia-limit-warning:
              $ref: '#/components/headers/XToniaLimitWarning'
            x-tonia-limit-scope:
              $ref: '#/components/headers/XToniaLimitScope'
            x-tonia-limit-kind:
              $ref: '#/components/headers/XToniaLimitKind'
            x-tonia-limit-used:
              $ref: '#/components/headers/XToniaLimitUsed'
            x-tonia-limit-value:
              $ref: '#/components/headers/XToniaLimitValue'
            x-tonia-limit-remaining:
              $ref: '#/components/headers/XToniaLimitRemaining'
            x-tonia-limit-period-ends-at:
              $ref: '#/components/headers/XToniaLimitPeriodEndsAt'
            x-tonia-policy-block:
              $ref: '#/components/headers/XToniaPolicyBlock'
            x-tonia-policy-categories:
              $ref: '#/components/headers/XToniaPolicyCategories'
            x-tonia-entitlement-block:
              $ref: '#/components/headers/XToniaEntitlementBlock'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassthroughOrBlockResponse'
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/RuntimeError'
  /v1/embeddings:
    post:
      tags:
      - runtime
      operationId: embeddingsCreate
      summary: OpenAI-shaped embeddings
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/HttpReferer'
      - $ref: '#/components/parameters/XToniaTitle'
      - $ref: '#/components/parameters/XToniaCategories'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassthroughRequest'
      responses:
        '200':
          description: Provider-native embeddings response
          headers:
            x-tonia-limit-warning:
              $ref: '#/components/headers/XToniaLimitWarning'
            x-tonia-limit-scope:
              $ref: '#/components/headers/XToniaLimitScope'
            x-tonia-limit-kind:
              $ref: '#/components/headers/XToniaLimitKind'
            x-tonia-limit-used:
              $ref: '#/components/headers/XToniaLimitUsed'
            x-tonia-limit-value:
              $ref: '#/components/headers/XToniaLimitValue'
            x-tonia-limit-remaining:
              $ref: '#/components/headers/XToniaLimitRemaining'
            x-tonia-limit-period-ends-at:
              $ref: '#/components/headers/XToniaLimitPeriodEndsAt'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassthroughResponse'
        default:
          $ref: '#/components/responses/RuntimeError'
  /v1/images/generations:
    post:
      tags:
      - runtime
      operationId: imagesGenerate
      summary: OpenAI-shaped image generations
      description: 'openai / xAI / StepFun only. Gemini image SKUs return HTTP 400

        `provider_requires_surface` (`required_surface: interactions`) — use

        `POST /v1/interactions`. Policy/entitlement denials are always hard HTTP

        (no chat_200).

        '
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/HttpReferer'
      - $ref: '#/components/parameters/XToniaTitle'
      - $ref: '#/components/parameters/XToniaCategories'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassthroughRequest'
      responses:
        '200':
          description: Provider-native image response
          headers:
            x-tonia-limit-warning:
              $ref: '#/components/headers/XToniaLimitWarning'
            x-tonia-limit-scope:
              $ref: '#/components/headers/XToniaLimitScope'
            x-tonia-limit-kind:
              $ref: '#/components/headers/XToniaLimitKind'
            x-tonia-limit-used:
              $ref: '#/components/headers/XToniaLimitUsed'
            x-tonia-limit-value:
              $ref: '#/components/headers/XToniaLimitValue'
            x-tonia-limit-remaining:
              $ref: '#/components/headers/XToniaLimitRemaining'
            x-tonia-limit-period-ends-at:
              $ref: '#/components/headers/XToniaLimitPeriodEndsAt'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassthroughResponse'
        default:
          $ref: '#/components/responses/RuntimeError'
  /v1/images/edits:
    post:
      tags:
      - runtime
      operationId: imagesEdit
      summary: OpenAI-shaped image edits
      description: 'openai / xAI / StepFun only. Pass may rebuild JSON→multipart

        before upstream. Gemini image SKUs return HTTP 400 `provider_requires_surface`

        (`required_surface: interactions`) — use `POST /v1/interactions` with

        multimodal `input` parts. Policy/entitlement denials are always hard HTTP.

        '
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/HttpReferer'
      - $ref: '#/components/parameters/XToniaTitle'
      - $ref: '#/components/parameters/XToniaCategories'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassthroughRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PassthroughRequest'
      responses:
        '200':
          description: Provider-native image edit response
          headers:
            x-tonia-limit-warning:
              $ref: '#/components/headers/XToniaLimitWarning'
            x-tonia-limit-scope:
              $ref: '#/components/headers/XToniaLimitScope'
            x-tonia-limit-kind:
              $ref: '#/components/headers/XToniaLimitKind'
            x-tonia-limit-used:
              $ref: '#/components/headers/XToniaLimitUsed'
            x-tonia-limit-value:
              $ref: '#/components/headers/XToniaLimitValue'
            x-tonia-limit-remaining:
              $ref: '#/components/headers/XToniaLimitRemaining'
            x-tonia-limit-period-ends-at:
              $ref: '#/components/headers/XToniaLimitPeriodEndsAt'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassthroughResponse'
        default:
          $ref: '#/components/responses/RuntimeError'
  /v1/responses:
    post:
      tags:
      - runtime
      operationId: responsesCreate
      summary: OpenAI Responses API
      description: 'WebSocket upgrade on this path is refused with JSON HTTP 426

        (`websocket_upgrade_unsupported`). Use HTTPS POST with `stream: true`

        for SSE.

        '
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/HttpReferer'
      - $ref: '#/components/parameters/XToniaTitle'
      - $ref: '#/components/parameters/XToniaCategories'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassthroughRequest'
      responses:
        '200':
          description: Provider-native Responses body, or chat_200 block carrier
          headers:
            x-tonia-limit-warning:
              $ref: '#/components/headers/XToniaLimitWarning'
            x-tonia-limit-scope:
              $ref: '#/components/headers/XToniaLimitScope'
            x-tonia-limit-kind:
              $ref: '#/components/headers/XToniaLimitKind'
            x-tonia-limit-used:
              $ref: '#/components/headers/XToniaLimitUsed'
            x-tonia-limit-value:
              $ref: '#/components/headers/XToniaLimitValue'
            x-tonia-limit-remaining:
              $ref: '#/components/headers/XToniaLimitRemaining'
            x-tonia-limit-period-ends-at:
              $ref: '#/components/headers/XToniaLimitPeriodEndsAt'
            x-tonia-policy-block:
              $ref: '#/components/headers/XToniaPolicyBlock'
            x-tonia-policy-categories:
              $ref: '#/components/headers/XToniaPolicyCategories'
            x-tonia-entitlement-block:
              $ref: '#/components/headers/XToniaEntitlementBlock'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassthroughOrBlockResponse'
            text/event-stream:
              schema:
                type: string
        '426':
          description: WebSocket upgrade refused (JSON body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredErrorEnvelope'
        default:
          $ref: '#/components/responses/RuntimeError'
  /v1/rerank:
    post:
      tags:
      - runtime
      operationId: rerankCreate
      summary: Cohere-shaped rerank
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/HttpReferer'
      - $ref: '#/components/parameters/XToniaTitle'
      - $ref: '#/components/parameters/XToniaCategories'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassthroughRequest'
      responses:
        '200':
          description: Provider-native rerank response
          headers:
            x-tonia-limit-warning:
              $ref: '#/components/headers/XToniaLimitWarning'
            x-tonia-limit-scope:
              $ref: '#/components/headers/XToniaLimitScope'
            x-tonia-limit-kind:
              $ref: '#/components/headers/XToniaLimitKind'
            x-tonia-limit-used:
              $ref: '#/components/headers/XToniaLimitUsed'
            x-tonia-limit-value:
              $ref: '#/components/headers/XToniaLimitValue'
            x-tonia-limit-remaining:
              $ref: '#/components/headers/XToniaLimitRemaining'
            x-tonia-limit-period-ends-at:
              $ref: '#/components/headers/XToniaLimitPeriodEndsAt'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassthroughResponse'
        default:
          $ref: '#/components/responses/RuntimeError'
  /v1/interactions:
    post:
      tags:
      - runtime
      operationId: interactionsCreate
      summary: Gemini-shaped interactions
      description: 'Gemini text and image SKUs. Image generate: `{model, input: "<prompt>",

        stream: false}`. Image edit: `input` is `[{type: text, text}, {type: image,

        mime_type, data}]` (`data` is raw base64, not a data URL). Response is native

        `interaction.steps`; output images are `model_output` parts with `type: image`

        or `mime_type` starting with `image/`. Do not call `/v1/images/*` or

        `/v1/chat/completions` for Gemini image SKUs.

        '
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/HttpReferer'
      - $ref: '#/components/parameters/XToniaTitle'
      - $ref: '#/components/parameters/XToniaCategories'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassthroughRequest'
      responses:
        '200':
          description: Provider-native interactions response
          headers:
            x-tonia-limit-warning:
              $ref: '#/components/headers/XToniaLimitWarning'
            x-tonia-limit-scope:
              $ref: '#/components/headers/XToniaLimitScope'
            x-tonia-limit-kind:
              $ref: '#/components/headers/XToniaLimitKind'
            x-tonia-limit-used:
              $ref: '#/components/headers/XToniaLimitUsed'
            x-tonia-limit-value:
              $ref: '#/components/headers/XToniaLimitValue'
            x-tonia-limit-remaining:
              $ref: '#/components/headers/XToniaLimitRemaining'
            x-tonia-limit-period-ends-at:
              $ref: '#/components/headers/XToniaLimitPeriodEndsAt'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassthroughResponse'
        default:
          $ref: '#/components/responses/RuntimeError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tonia_*
      description: '`Authorization: Bearer tonia_*`. Wins over `x-api-key` when both are

        sent. Prefer for OpenAI-shaped helpers.

        '
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: '`x-api-key: tonia_*`. Prefer for Anthropic-shaped `/v1/messages`.

        Ignored for auth lookup when `Authorization` is also present.

        '
  parameters:
    ModelId:
      name: id
      in: path
      required: true
      schema:
        type: string
    HttpReferer:
      name: HTTP-Referer
      in: header
      required: false
      schema:
        type: string
      description: Optional app attribution (also accepts `Referer`). Never gates admission.
    XToniaTitle:
      name: X-Tonia-Title
      in: header
      required: false
      schema:
        type: string
      description: Optional app title (aliases `X-OpenRouter-Title`, `X-Title`).
    XToniaCategories:
      name: X-Tonia-Categories
      in: header
      required: false
      schema:
        type: string
      description: Optional comma-separated categories (max 8). Alias `X-OpenRouter-Categories`.
  headers:
    RetryAfter:
      description: Seconds to wait before retrying when `error.retryable` is true.
      schema:
        type: integer
        minimum: 0
    XToniaLimitWarning:
      description: Soft-limit warning present when usage ≥ 80% of quota/budget
      schema:
        type: string
        example: usage_limit_80_percent
    XToniaLimitScope:
      description: Soft-limit scope. Wire values are `member` or `organization` (`organization` means the Workspace).
      schema:
        type: string
    XToniaLimitKind:
      description: Soft-limit kind (`requests`, `managed_budget`, or `member_budget`)
      schema:
        type: string
    XToniaLimitUsed:
      description: Current usage (request count or CAD cents)
      schema:
        type: string
    XToniaLimitValue:
      description: Limit value (request count or CAD cents)
      schema:
        type: string
    XToniaLimitRemaining:
      description: Remaining quota or budget
      schema:
        type: string
    XToniaLimitPeriodEndsAt:
      description: Period end as ISO-8601 UTC
      schema:
        type: string
    XToniaPolicyBlock:
      description: Present on chat_200 policy blocks
      schema:
        type: string
    XToniaPolicyCategories:
      description: Comma-separated DLP categories on chat_200 policy blocks
      schema:
        type: string
    XToniaEntitlementBlock:
      description: Present on chat_200 entitlement blocks
      schema:
        type: string
  responses:
    RuntimeError:
      description: 'Structured runtime error. Admission 429 is `type: rate_limit_error`,

        `code: admission_rate_limited`. Monthly quota 429 is `type: entitlement_error`,

        `code: request_quota_exhausted`. Budget exhaustion is 402 `entitlement_error`

        and is not retryable.

        '
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredErrorEnvelope'
  schemas:
    ReasoningDescriptor:
      type: object
      description: tonia-native per-model reasoning effort descriptor
      required:
      - efforts
      - default
      properties:
        efforts:
          type: array
          items:
            type: string
          description: Declared effort labels for this model
        default:
          type: string
          description: Default effort when the client omits reasoning_effort
    PublicChannel:
      type: object
      description: >
        Counterparty and availability for a public Managed SKU. Not a string.
        `amazon_bedrock` is BYOK-only (`managed_available: false`).
      required:
      - managed_available
      - byok_available
      - roster_group
      - jurisdiction
      - wire
      - counterparty
      properties:
        managed_available:
          type: boolean
        byok_available:
          type: boolean
        roster_group:
          type: string
        jurisdiction:
          type: string
        wire:
          type: string
        counterparty:
          type: string
          enum:
          - direct_lab
          - alibaba_model_studio
          - aws_bedrock_byok
    EntitlementTemplate:
      type: object
      description: Plan flags and pack sizes on a public catalogue offer
      required:
      - seats_per_pack
      - request_quota_per_pack
      - managed_budget_cents
      - managed_credit_cents
      - media_guard
      - team_management
      - on_prem
      - image_generation
      - chat_included
      properties:
        seats_per_pack:
          type: integer
        request_quota_per_pack:
          type: integer
        managed_budget_cents:
          type: integer
        managed_credit_cents:
          type: integer
        media_guard:
          type: boolean
        team_management:
          type: boolean
        on_prem:
          type: boolean
        image_generation:
          type: boolean
        chat_included:
          type: boolean
    PublicCatalogue:
      type: object
      required:
